  <!--
    ================================================================
    GESTÃO DE ORDENS DE SERVIÇO - VERSÃO HTML + SUPABASE
    Substitui a aplicação Streamlit/Python.

    1) Crie uma tabela "ordens_servico" no Supabase.
    2) Execute o SQL abaixo no SQL Editor do Supabase:

    create table if not exists public.ordens_servico (
      id bigserial primary key,
      descricao text not null,
      data text,
      hora_abertura text,
      solicitante text not null,
      local text not null,
      tipo text default '',
      status text default 'Pendente',
      data_conclusao text default '',
      hora_conclusao text default '',
      executante1 text default '',
      executante2 text default '',
      urgente text default 'Não',
      observacoes text default '',
      created_at timestamptz default now()
    );

    alter table public.ordens_servico enable row level security;

    create policy "OS - leitura publica"
      on public.ordens_servico for select
      to anon
      using (true);

    create policy "OS - insercao publica"
      on public.ordens_servico for insert
      to anon
      with check (true);

    create policy "OS - atualizacao publica"
      on public.ordens_servico for update
      to anon
      using (true)
      with check (true);

    create policy "OS - exclusao publica"
      on public.ordens_servico for delete
      to anon
      using (true);

    ATENÇÃO:
    - No HTML use somente a URL do projeto e a chave "anon/public".
    - NUNCA coloque a service_role key neste arquivo.
    - As políticas acima deixam o sistema público para manter o comportamento
      da aplicação original. Se quiser segurança por usuários/login, as
      políticas deverão ser restringidas posteriormente.

    APLICAÇÃO:
    - Abra este arquivo diretamente ou publique no GitHub Pages.
    - Preencha SUPABASE_URL e SUPABASE_ANON_KEY abaixo.
    - O banco passa a ser a fonte oficial dos dados.
    - Backups são mantidos no navegador e também podem ser baixados como JSON.
  -->

<script>
/* ================================================================
   CONFIGURAÇÃO DO SUPABASE
   ================================================================ */
const SUPABASE_URL = "https://tcfbgekwkejgywoyuppt.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_dr1YdwfMQ5sp1Zjp0kOPKA_4djuJUab";

const TABLE_NAME = "ordens_servico";
const SENHA_SUPERVISAO = "king@2025";

const EXECUTANTES_PREDEFINIDOS = ["Guilherme", "Ismael"];

const TIPOS_MANUTENCAO = [
  "Elétrica",
  "Mecânica",
  "Refrigeração",
  "Hidráulica",
  "Civil",
  "Instalação"
];

const STATUS_OPCOES = [
  "Pendente",
  "Pausado",
  "Em execução",
  "Concluído"
];

let supabaseClient = null;
let dados = [];
let autenticado = false;
let notificacoesLimpas = false;
let chartTipo = null;
let chartExecutantes = null;
let chartStatus = null;
let dashboardPeriodo = "Todos";
let dashboardMes = new Date().getMonth() + 1;
let dashboardAno = new Date().getFullYear();

/* ================================================================
   INICIALIZAÇÃO
   ================================================================ */
document.addEventListener("DOMContentLoaded", async () => {
  configurarMenu();
  carregarLogo();
  inicializarSupabase();
  await carregarDados();
  renderInicio();

  // Mantém o comportamento original de recarregar a aplicação periodicamente.
  setTimeout(() => {
    if (document.visibilityState === "visible") window.location.reload();
  }, 600000);
});

function configurarMenu() {
  document.querySelectorAll(".menu-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      abrirPagina(btn.dataset.page);
      document.getElementById("sidebar").classList.remove("open");
    });
  });
}

function abrirPagina(page) {
  document.querySelectorAll(".page-section").forEach(el => el.classList.add("hidden"));
  const alvo = document.getElementById("page-" + page);
  if (alvo) alvo.classList.remove("hidden");

  document.querySelectorAll(".menu-btn").forEach(btn => {
    btn.classList.toggle("active", btn.dataset.page === page);
  });

  if (page === "inicio") renderInicio();
  if (page === "cadastrar") renderCadastrar();
  if (page === "listar") renderListar();
  if (page === "buscar") renderBuscar();
  if (page === "dashboard") renderDashboard();
  if (page === "supervisao") renderSupervisao();
}

function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

function inicializarSupabase() {
  const status = document.getElementById("connectionStatus");

  if (
    SUPABASE_URL.startsWith("COLE_") ||
    SUPABASE_ANON_KEY.startsWith("COLE_") ||
    !window.supabase
  ) {
    status.innerHTML = '<span class="dot error"></span> Configure o Supabase no código';
    return false;
  }

  try {
    supabaseClient = window.supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );
    return true;
  } catch (erro) {
    status.innerHTML = '<span class="dot error"></span> Erro na configuração';
    console.error(erro);
    return false;
  }
}

async function testarConexao() {
  const status = document.getElementById("connectionStatus");

  if (!supabaseClient) {
    status.innerHTML = '<span class="dot error"></span> Supabase não configurado';
    return false;
  }

  try {
    const { error } = await supabaseClient
      .from(TABLE_NAME)
      .select("id")
      .limit(1);

    if (error) throw error;

    status.innerHTML = '<span class="dot ok"></span> Supabase conectado';
    return true;
  } catch (erro) {
    status.innerHTML = '<span class="dot error"></span> Erro no Supabase';
    console.error("Erro de conexão:", erro);
    return false;
  }
}

/* ================================================================
   DADOS
   ================================================================ */
async function carregarDados() {
  if (!supabaseClient) {
    dados = [];
    return;
  }

  mostrarLoading("Carregando dados...");

  try {
    const { data, error } = await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .order("id", { ascending: true });

    if (error) throw error;

    dados = (data || []).map(normalizarRegistro);
    atualizarStatusConexao(true);
  } catch (erro) {
    console.error("Erro ao carregar dados:", erro);
    dados = [];
    atualizarStatusConexao(false);
    mostrarToast("Erro ao carregar os dados do Supabase.", "danger");
  }
}

function normalizarRegistro(row) {
  return {
    id: Number(row.id),
    descricao: row.descricao ?? "",
    data: row.data ?? "",
    hora_abertura: row.hora_abertura ?? "",
    solicitante: row.solicitante ?? "",
    local: row.local ?? "",
    tipo: row.tipo ?? "",
    status: row.status ?? "Pendente",
    data_conclusao: row.data_conclusao ?? "",
    hora_conclusao: row.hora_conclusao ?? "",
    executante1: row.executante1 ?? "",
    executante2: row.executante2 ?? "",
    urgente: row.urgente ?? "Não",
    observacoes: row.observacoes ?? "",
    created_at: row.created_at ?? ""
  };
}

function atualizarStatusConexao(ok) {
  const status = document.getElementById("connectionStatus");
  if (!status) return;
  status.innerHTML = ok
    ? '<span class="dot ok"></span> Supabase conectado'
    : '<span class="dot error"></span> Erro no Supabase';
}

async function inserirOS(registro) {
  if (!supabaseClient) {
    mostrarToast("Configure o Supabase antes de salvar.", "danger");
    return false;
  }

  try {
    // Remove o id para usar auto-incremento do banco
    const { id, ...registroSemId } = registro;
    
    const { error } = await supabaseClient
      .from(TABLE_NAME)
      .insert([registroSemId]);

    if (error) throw error;

    await carregarDados();
    return true;
  } catch (erro) {
    console.error("Erro ao inserir:", erro);
    
    // Verifica se é erro de chave duplicada
    if (erro.message && erro.message.includes("duplicate key")) {
      mostrarToast("Erro: Já existe uma OS com este ID. O sistema usa auto-incremento, não tente definir o ID manualmente.", "danger");
    } else {
      mostrarToast("Não foi possível salvar a OS: " + erro.message, "danger");
    }
    return false;
  }
}

async function atualizarOSNoBanco(id, alteracoes) {
  if (!supabaseClient) {
    mostrarToast("Supabase não configurado.", "danger");
    return false;
  }

  try {
    const { error } = await supabaseClient
      .from(TABLE_NAME)
      .update(alteracoes)
      .eq("id", id);

    if (error) throw error;

    await carregarDados();
    return true;
  } catch (erro) {
    console.error("Erro ao atualizar:", erro);
    mostrarToast("Não foi possível atualizar a OS: " + erro.message, "danger");
    return false;
  }
}

/* ================================================================
   UTILITÁRIOS
   ================================================================ */
function agoraBrasil() {
  const agora = new Date();
  const partes = new Intl.DateTimeFormat("pt-BR", {
    timeZone: "America/Sao_Paulo",
    day: "2-digit",
    month: "2-digit",
    year: "numeric",
    hour: "2-digit",
    minute: "2-digit",
    hour12: false
  }).formatToParts(agora);

  const get = tipo => partes.find(p => p.type === tipo)?.value || "";

  return {
    data: `${get("day")}/${get("month")}/${get("year")}`,
    hora: `${get("hour")}:${get("minute")}`
  };
}

function escapeHtml(valor) {
  return String(valor ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}

function badgeStatus(status) {
  const classes = {
    "Pendente": "badge-pendente",
    "Pausado": "badge-pausado",
    "Em execução": "badge-execucao",
    "Concluído": "badge-concluido"
  };
  return `<span class="badge ${classes[status] || "badge-pausado"}">${escapeHtml(status)}</span>`;
}

function badgeUrgente(valor) {
  return valor === "Sim"
    ? '<span class="badge badge-urgente">🚨 SIM</span>'
    : "Não";
}

function mostrarLoading(texto) {
  document.querySelectorAll(".page-section").forEach(el => {
    if (!el.classList.contains("hidden")) {
      el.innerHTML = `<div class="card loading">${escapeHtml(texto)}</div>`;
    }
  });
}

function mostrarToast(texto, tipo = "info") {
  const root = document.getElementById("modalRoot");
  const div = document.createElement("div");
  div.className = `alert alert-${tipo}`;
  div.style.position = "fixed";
  div.style.right = "20px";
  div.style.bottom = "20px";
  div.style.zIndex = "200";
  div.style.maxWidth = "450px";
  div.style.boxShadow = "0 4px 15px rgba(0,0,0,.15)";
  div.innerHTML = escapeHtml(texto);
  root.appendChild(div);
  setTimeout(() => div.remove(), 4500);
}

function carregarLogo() {
  // Coloque "logo.png" no mesmo diretório deste HTML para exibir o logo.
  const img = document.getElementById("logoImg");
  img.src = "logo.png";
  img.onload = () => img.classList.remove("hidden");
  img.onerror = () => img.classList.add("hidden");
}

/* ================================================================
   PÁGINA INICIAL
   ================================================================ */
function renderInicio() {
  const container = document.getElementById("page-inicio");

function limparNotificacoes() {
  notificacoesLimpas = true;
  renderInicio();
}

function mostrarNotificacoes() {

  renderInicio();
}

function renderCadastrar() {
  const container = document.getElementById("page-cadastrar");

  container.innerHTML = `

      <h2>📝 Cadastrar Nova Ordem de Serviço</h2>

      <form id="formCadastro">
        <div class="grid">
          <div class="field">
            <label>Descrição da atividade*</label>
            <textarea id="cadDescricao" required></textarea>
          </div>

          <div>
            <div class="field">
              <label>Solicitante*</label>
              <input id="cadSolicitante" required>
            </div>

            <div class="field">
              <label>Local*</label>
              <input id="cadLocal" required>
            </div>

            <label class="checkbox-line">
              <input type="checkbox" id="cadUrgente">
              Urgente
            </label>
          </div>
        </div>

        <button class="btn-primary" type="submit">Cadastrar OS</button>
      </form>
    </div>
  `;

  document.getElementById("formCadastro").addEventListener("submit", async e => {
    e.preventDefault();

    const descricao = document.getElementById("cadDescricao").value.trim();
    const solicitante = document.getElementById("cadSolicitante").value.trim();
    const local = document.getElementById("cadLocal").value.trim();
    const urgente = document.getElementById("cadUrgente").checked;

    if (!descricao || !solicitante || !local) {
      mostrarToast("Preencha todos os campos obrigatórios (*).", "danger");
      return;
    }

    const agora = agoraBrasil();

    const novaOS = {
      descricao,
      data: agora.data,
      hora_abertura: agora.hora,
      solicitante,
      local,
      tipo: "",
      status: "Pendente",
      data_conclusao: "",
      hora_conclusao: "",
      executante1: "",
      executante2: "",
      urgente: urgente ? "Sim" : "Não",
      observacoes: ""
    };

    const ok = await inserirOS(novaOS);

    if (ok) {
      mostrarToast("Ordem cadastrada com sucesso!", "success");
      document.getElementById("formCadastro").reset();
      renderCadastrar();
    }
  });
}

function montarTabelaListagem() {
  const status = document.getElementById("filtroStatus")?.value || "Todos";
  const tipo = document.getElementById("filtroTipo")?.value || "Todos";

  let lista = [...dados];

  if (status !== "Todos") lista = lista.filter(x => x.status === status);
  if (tipo !== "Todos") lista = lista.filter(x => x.tipo === tipo);

  lista.sort((a,b) => b.id - a.id);

  document.getElementById("tabelaListagem").innerHTML = tabelaOS(lista);
}

function renderBuscar() {
  const container = document.getElementById("page-buscar");

  container.innerHTML = `
    <div class="card">
      <h2>🔍 Busca Avançada</h2>

      <div class="grid">
        <div class="field">
          <label>Critério de busca</label>
          <select id="criterioBusca">
            <option value="status">Status</option>
            <option value="id">ID</option>
            <option value="solicitante">Solicitante</option>
            <option value="local">Local</option>
            <option value="tipo">Tipo</option>
            <option value="executante1">Executante1</option>
            <option value="executante2">Executante2</option>
            <option value="observacoes">Observações</option>
          </select>
        </div>

        <div class="field">
          <label id="labelBusca">Selecione o status</label>
          <div id="campoBusca"></div>
        </div>
      </div>

      <div id="resultadoBusca"></div>
    </div>
  `;

  document.getElementById("criterioBusca").addEventListener("change", atualizarCampoBusca);
  atualizarCampoBusca();
}

function atualizarCampoBusca() {
  const criterio = document.getElementById("criterioBusca").value;
  const campo = document.getElementById("campoBusca");
  const label = document.getElementById("labelBusca");

  if (criterio === "status") {
    label.textContent = "Selecione o status";
    campo.innerHTML = `
      <select id="valorBusca">
        ${STATUS_OPCOES.map(x => `<option>${escapeHtml(x)}</option>`).join("")}
      </select>`;
  } else if (criterio === "tipo") {
    label.textContent = "Selecione o tipo";
    campo.innerHTML = `
      <select id="valorBusca">
        ${TIPOS_MANUTENCAO.map(x => `<option>${escapeHtml(x)}</option>`).join("")}
      </select>`;
  } else if (criterio === "id") {
    label.textContent = "Digite o ID da OS";
    campo.innerHTML = `<input type="number" id="valorBusca" min="1">`;
  } else {
    label.textContent = "Digite o texto para busca";
    campo.innerHTML = `<input type="text" id="valorBusca" placeholder="Digite o ${criterio}">`;
  }

  document.getElementById("valorBusca").addEventListener("input", executarBusca);
  executarBusca();
}

function executarBusca() {
  const criterio = document.getElementById("criterioBusca")?.value;
  const valor = document.getElementById("valorBusca")?.value ?? "";
  const destino = document.getElementById("resultadoBusca");

  if (!destino) return;

  let resultado = [];

  if (criterio === "id") {
    const id = Number(valor);
    if (!id) {
      destino.innerHTML = "";
      return;
    }
    resultado = dados.filter(x => x.id === id);
  } else {
    resultado = dados.filter(x => {
      const campo = String(x[criterio] ?? "");
      return campo.toLowerCase().includes(String(valor).toLowerCase());
    });
  }

  if (!valor) {
    destino.innerHTML = "";
    return;
  }

  destino.innerHTML = `
    <div class="alert ${resultado.length ? "alert-success" : "alert-warning"}">
      ${resultado.length
        ? `Encontradas ${resultado.length} OS:`
        : "Nenhuma OS encontrada com os critérios informados."}
    </div>
    ${resultado.length ? tabelaOS(resultado) : ""}
  `;
}

    dashboardAno = Number(e.target.value);

  });

  desenharGraficoStatus();
}

function contar(lista, campo) {
  const mapa = {};
  lista.forEach(x => {
    const valor = String(x[campo] || "").trim();
    if (valor) mapa[valor] = (mapa[valor] || 0) + 1;
  });
  return mapa;
}

function desenharGraficoTipos() {
  if (!window.Chart) return;

  const mapa = contar(dados, "tipo");
  const labels = Object.keys(mapa);
  const values = Object.values(mapa);

  if (chartTipo) chartTipo.destroy();

  chartTipo = new Chart(document.getElementById("chartTipoCanvas"), {
    type: "doughnut",
    data: { labels, datasets: [{ data: values }] },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: {
        legend: { position: "right" }
      }
    }
  });
}

function parseDataBR(valor) {
  if (!valor || typeof valor !== "string") return null;
  const p = valor.split("/");
  if (p.length !== 3) return null;
  const d = Number(p[0]), m = Number(p[1]), y = Number(p[2]);
  const data = new Date(y, m - 1, d);
  if (Number.isNaN(data.getTime())) return null;
  return data;
}

function desenharGraficoExecutantes() {
  if (!window.Chart) return;

  let lista = dados.filter(x => x.status === "Concluído");

  if (dashboardPeriodo === "Por Mês/Ano") {
    lista = lista.filter(x => {
      const data = parseDataBR(x.data_conclusao);
      return data &&
        data.getMonth() + 1 === dashboardMes &&
        data.getFullYear() === dashboardAno;
    });
  }

  const nomes = [];
  lista.forEach(x => {
    if (x.executante1) nomes.push(x.executante1);
    if (x.executante2) nomes.push(x.executante2);
  });

  const mapa = {};
  nomes.forEach(nome => mapa[nome] = (mapa[nome] || 0) + 1);

  if (chartExecutantes) chartExecutantes.destroy();

  chartExecutantes = new Chart(document.getElementById("chartExecutantesCanvas"), {
    type: "doughnut",
    data: {
      labels: Object.keys(mapa),
      datasets: [{ data: Object.values(mapa) }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { position: "right" } }
    }
  });

  if (!nomes.length) {
    mostrarToast("Nenhuma OS concluída encontrada para o período selecionado.", "info");
  }
}

function desenharGraficoStatus() {
  if (!window.Chart) return;

  const mapa = contar(dados, "status");

  if (chartStatus) chartStatus.destroy();

  chartStatus = new Chart(document.getElementById("chartStatusCanvas"), {
    type: "bar",
    data: {
      labels: Object.keys(mapa),
      datasets: [{
        label: "Quantidade de OS",
        data: Object.values(mapa)
      }]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true, ticks: { precision: 0 } } }
    }
  });
}

      </div>

      <button class="btn-primary" type="submit">Atualizar OS</button>
    </form>
  `;

  document.getElementById("updStatus").addEventListener("change", atualizarPreviewConclusao);

  document.getElementById("formAtualizacaoOS").addEventListener("submit", async e => {
    e.preventDefault();

    const tipo = document.getElementById("updTipo").value;
    const status = document.getElementById("updStatus").value;
    const executante1 = document.getElementById("updExecutante1").value;
    const executante2 = document.getElementById("updExecutante2").value;
    const observacoes = document.getElementById("updObservacoes").value.trim();

    if ((status === "Em execução" || status === "Concluído") && !executante1) {
      mostrarToast("Selecione pelo menos um executante principal para este status!", "danger");
      return;
    }

    const alteracoes = {
      tipo,
      status,
      executante1,
      executante2,
      observacoes
    };

    if (status === "Concluído") {
      const agora = agoraBrasil();
      alteracoes.data_conclusao = agora.data;
      alteracoes.hora_conclusao = agora.hora;
    } else {
      alteracoes.data_conclusao = "";
      alteracoes.hora_conclusao = "";
    }

    const ok = await atualizarOSNoBanco(id, alteracoes);

    if (ok) {
      mostrarToast("OS atualizada com sucesso!", "success");
      renderAtualizar();
    }
  });
}

function atualizarPreviewConclusao() {
  const status = document.getElementById("updStatus").value;
  const data = document.getElementById("dataConclusaoPreview");
  const hora = document.getElementById("horaConclusaoPreview");

  if (status === "Concluído") {
    const agora = agoraBrasil();
    data.value = agora.data;
    hora.value = agora.hora;
  } else {
    data.value = "";
    hora.value = "";
  }
}

/* ================================================================
   BACKUPS
   ================================================================ */
function chaveBackups() {
  return "kingjoe_os_backups_v1";
}

function obterBackups() {
  try {
    return JSON.parse(localStorage.getItem(chaveBackups()) || "[]");
  } catch {
    return [];
  }
}

function salvarBackups(lista) {
  localStorage.setItem(chaveBackups(), JSON.stringify(lista));
}

function criarBackupLocal() {
  const lista = obterBackups();
  const agora = new Date();

  const backup = {
    nome: `ordens_servico_${formatarTimestamp(agora)}.json`,
    data: agora.toISOString(),
    dados: dados
  };

  lista.unshift(backup);
  salvarBackups(lista.slice(0, 10));

  baixarArquivo(
    JSON.stringify(dados, null, 2),
    backup.nome,
    "application/json"
  );

  renderBackups();
  mostrarToast("Backup criado e baixado com sucesso.", "success");
}

function formatarTimestamp(data) {
  const pad = n => String(n).padStart(2, "0");
  return `${data.getFullYear()}${pad(data.getMonth()+1)}${pad(data.getDate())}_${pad(data.getHours())}${pad(data.getMinutes())}${pad(data.getSeconds())}`;
}

function limparBackupsAntigos() {
  const lista = obterBackups().slice(0, 10);
  salvarBackups(lista);
  renderBackups();
  mostrarToast("Mantidos apenas os 10 backups mais recentes.", "success");
}

function restaurarBackup(indice) {
  const lista = obterBackups();
  const backup = lista[indice];

  if (!backup) return;

  if (!confirm(`Restaurar o backup "${backup.nome}"?\n\nIsso substituirá os dados atuais do Supabase.`)) {
    return;
  }

  restaurarDadosNoSupabase(backup.dados);
}

async function restaurarDadosNoSupabase(registros) {
  if (!supabaseClient) {
    mostrarToast("Supabase não configurado.", "danger");
    return;
  }

  try {
    // Apaga os registros existentes.
    const { error: deleteError } = await supabaseClient
      .from(TABLE_NAME)
      .delete()
      .gte("id", 0);

    if (deleteError) throw deleteError;

    // Insere novamente o conteúdo do backup.
    if (registros.length) {
      const registrosLimpos = registros.map(x => ({
        id: Number(x.id),
        descricao: x.descricao || "",
        data: x.data || "",
        hora_abertura: x.hora_abertura || "",
        solicitante: x.solicitante || "",
        local: x.local || "",
        tipo: x.tipo || "",
        status: x.status || "Pendente",
        data_conclusao: x.data_conclusao || "",
        hora_conclusao: x.hora_conclusao || "",
        executante1: x.executante1 || "",
        executante2: x.executante2 || "",
        urgente: x.urgente || "Não",
        observacoes: x.observacoes || ""
      }));

      const { error: insertError } = await supabaseClient
        .from(TABLE_NAME)
        .insert(registrosLimpos);

      if (insertError) throw insertError;
    }

    await carregarDados();
    renderBackups();
    mostrarToast("Backup restaurado no Supabase com sucesso.", "success");
  } catch (erro) {
    console.error(erro);
    mostrarToast("Erro ao restaurar backup: " + erro.message, "danger");
  }
}

function baixarArquivo(conteudo, nome, tipo) {
  const blob = new Blob([conteudo], { type: tipo });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = nome;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function exportarCSV() {
  if (!dados.length) {
    mostrarToast("Não existem dados para exportar.", "warning");
    return;
  }

  const colunas = [
    ["ID", "id"],
    ["Descrição", "descricao"],
    ["Data", "data"],
    ["Hora Abertura", "hora_abertura"],
    ["Solicitante", "solicitante"],
    ["Local", "local"],
    ["Tipo", "tipo"],
    ["Status", "status"],
    ["Data Conclusão", "data_conclusao"],
    ["Hora Conclusão", "hora_conclusao"],
    ["Executante1", "executante1"],
    ["Executante2", "executante2"],
    ["Urgente", "urgente"],
    ["Observações", "observacoes"]
  ];

  const esc = valor => `"${String(valor ?? "").replace(/"/g, '""')}"`;

  const linhas = [
    colunas.map(x => esc(x[0])).join(";"),
    ...dados.map(row => colunas.map(x => esc(row[x[1]])).join(";"))
  ];

  baixarArquivo(
    "\ufeff" + linhas.join("\n"),
    "ordens_servico.csv",
    "text/csv;charset=utf-8"
  );

  mostrarToast("CSV exportado com sucesso.", "success");
}

function renderBackups() {
  const container = document.getElementById("superBackups");
  const lista = obterBackups();

  container.innerHTML = `
    <h3>💾 Gerenciamento de Backups</h3>

    <div class="alert alert-info">
      Nesta versão, o Supabase é o banco principal. Os backups locais ficam no navegador
      e também podem ser baixados para o computador.
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="criarBackupLocal()">🔄 Criar Backup Agora</button>
      <button class="btn-secondary" onclick="limparBackupsAntigos()">🧹 Limpar Backups Antigos</button>
      <button class="btn-secondary" onclick="exportarCSV()">📥 Exportar CSV</button>

    <h4>Backups armazenados neste navegador</h4>

      ? `<div class="table-wrap" style="margin-top:12px">

            <thead><tr><th>Backup</th><th>Data</th><th>Ação</th></tr></thead>
            <tbody>
              ${lista.map((b,i) => `
                <tr>
                  <td>${escapeHtml(b.nome)}</td>
                  <td>${new Date(b.data).toLocaleString("pt-BR")}</td>

                </tr>
              `).join("")}
            </tbody>
          </table>
        </div>`
      : `<div class="empty">Nenhum backup disponível.</div>`

  `;
}

/* ================================================================
   IMPORTAÇÃO DE DADOS ANTIGOS - CORRIGIDO PARA SUPORTAR MAIS DE 1000 REGISTROS
   ================================================================ */
function abrirImportacaoCSV() {
  const root = document.getElementById("modalRoot");

  root.innerHTML = `
    <div class="modal">
      <div class="modal-card">
        <h3>📤 Importar CSV antigo</h3>
        <p>Selecione o arquivo <strong>ordens_servico.csv</strong> da versão Python.</p>
        <input type="file" id="arquivoCSV" accept=".csv,text/csv">
        <div class="actions">
          <button class="btn-primary" onclick="importarCSVSelecionado()">Importar</button>
          <button class="btn-secondary" onclick="fecharModal()">Cancelar</button>
        </div>
        <div id="progressoImportacao">
          <div class="progress-bar"><div class="fill" id="progressBarFill"></div></div>
          <div id="progressoTexto">Aguardando arquivo...</div>
        </div>
      </div>
    </div>
  `;
}

function fecharModal() {
  document.getElementById("modalRoot").innerHTML = "";
}

function atualizarProgresso(percentual, texto) {
  const fill = document.getElementById("progressBarFill");
  const textoEl = document.getElementById("progressoTexto");
  if (fill) fill.style.width = percentual + "%";
  if (textoEl) textoEl.textContent = texto;
}

async function importarCSVSelecionado() {
  const arquivo = document.getElementById("arquivoCSV").files[0];

  if (!arquivo) {
    mostrarToast("Selecione um arquivo CSV.", "warning");
    return;
  }

  atualizarProgresso(0, "Lendo arquivo...");

  try {
    const texto = await arquivo.text();
    const linhas = parseCSV(texto);

    if (!linhas.length) {
      throw new Error("CSV vazio.");
    }

    const cab = linhas[0].map(x => x.trim());

    const achar = (...nomes) => {
      const idx = cab.findIndex(c => nomes.includes(c));
      return idx;
    };

    const idx = {
      id: achar("ID", "id"),
      descricao: achar("Descrição", "descricao"),
      data: achar("Data", "data"),
      hora: achar("Hora Abertura", "hora_abertura"),
      solicitante: achar("Solicitante", "solicitante"),
      local: achar("Local", "local"),
      tipo: achar("Tipo", "tipo"),
      status: achar("Status", "status"),
      dataConc: achar("Data Conclusão", "data_conclusao"),
      horaConc: achar("Hora Conclusão", "hora_conclusao"),
      exec1: achar("Executante1", "Executante 1", "executante1"),
      exec2: achar("Executante2", "Executante 2", "executante2"),
      urgente: achar("Urgente", "urgente"),
      obs: achar("Observações", "Observacoes", "observacoes"),
      executanteAntigo: achar("Executante")
    };

    const registros = [];

    for (let i = 1; i < linhas.length; i++) {
      const r = linhas[i];
      if (!r.length) continue;

      const get = key => idx[key] >= 0 ? (r[idx[key]] || "").trim() : "";

      let exec1 = get("exec1");
      let exec2 = get("exec2");

      if (!exec1 && idx.executanteAntigo >= 0) {
        exec1 = get("executanteAntigo");
      }

      // Ignora registros sem ID ou descrição
      const idStr = get("id");
      if (!idStr || !get("descricao")) continue;

      registros.push({
        id: Number(idStr),
        descricao: get("descricao"),
        data: get("data"),
        hora_abertura: get("hora"),
        solicitante: get("solicitante"),
        local: get("local"),
        tipo: get("tipo"),
        status: get("status") || "Pendente",
        data_conclusao: get("dataConc"),
        hora_conclusao: get("horaConc"),
        executante1: exec1,
        executante2: exec2,
        urgente: get("urgente") || "Não",
        observacoes: get("obs")
      });
    }

    const validos = registros.filter(x => x.id && x.descricao);

    if (!validos.length) {
      throw new Error("Nenhum registro válido encontrado.");
    }

    atualizarProgresso(10, `Preparando ${validos.length} registros para importação...`);

    // Dividir em lotes de 900 registros (abaixo do limite de 1000)
    const BATCH_SIZE = 900;
    const totalBatches = Math.ceil(validos.length / BATCH_SIZE);
    let importados = 0;
    let erros = [];

    for (let batch = 0; batch < totalBatches; batch++) {
      const inicio = batch * BATCH_SIZE;
      const fim = Math.min(inicio + BATCH_SIZE, validos.length);
      const lote = validos.slice(inicio, fim);

      const percentual = 10 + (batch / totalBatches) * 80;
      atualizarProgresso(percentual, `Importando lote ${batch + 1} de ${totalBatches} (${lote.length} registros)...`);

      try {
        // Usar upsert com onConflict para evitar duplicatas
        const { error } = await supabaseClient
          .from(TABLE_NAME)
          .upsert(lote, { onConflict: "id" });

        if (error) {
          // Se der erro, tenta inserir um por um para identificar qual deu problema
          console.warn("Erro no lote, tentando individualmente:", error);
          for (const reg of lote) {
            try {
              const { error: singleError } = await supabaseClient
                .from(TABLE_NAME)
                .upsert([reg], { onConflict: "id" });
              if (singleError) {
                erros.push(`ID ${reg.id}: ${singleError.message}`);
              } else {
                importados++;
              }
            } catch (e) {
              erros.push(`ID ${reg.id}: ${e.message}`);
            }
          }
        } else {
          importados += lote.length;
        }
      } catch (e) {
        erros.push(`Lote ${batch + 1}: ${e.message}`);
      }
    }

    atualizarProgresso(95, "Finalizando...");

    await carregarDados();
    fecharModal();

    let msg = `${importados} OS importadas para o Supabase.`;
    if (erros.length > 0) {
      msg += `\nErros em ${erros.length} registros: ${erros.slice(0, 5).join("; ")}${erros.length > 5 ? "..." : ""}`;
      mostrarToast(msg, "warning");
    } else {
      mostrarToast(msg, "success");
    }

    abrirPagina("listar");

  } catch (erro) {
    console.error(erro);
    document.getElementById("progressoTexto").innerHTML =
      `<div class="alert alert-danger">${escapeHtml(erro.message)}</div>`;
    mostrarToast("Erro na importação: " + erro.message, "danger");
  }
}

function parseCSV(texto) {
  const linhas = [];
  let linha = [];
  let campo = "";
  let aspas = false;

  for (let i = 0; i < texto.length; i++) {
    const c = texto[i];
    const n = texto[i + 1];

    if (c === '"' && aspas && n === '"') {
      campo += '"';
      i++;
    } else if (c === '"') {
      aspas = !aspas;
    } else if ((c === ";" || c === ",") && !aspas) {
      linha.push(campo);
      campo = "";
    } else if ((c === "\n" || c === "\r") && !aspas) {
      if (c === "\r" && n === "\n") i++;
      linha.push(campo);
      if (linha.some(x => x !== "")) linhas.push(linha);
      linha = [];
      campo = "";
    } else {
      campo += c;
    }
  }

  linha.push(campo);
  if (linha.some(x => x !== "")) linhas.push(linha);

  return linhas;
}

  _renderBackupsOriginal();

    btn.className = "btn-secondary";
    btn.textContent = "📤 Importar CSV antigo";

    actions.appendChild(btn);
  }
};
